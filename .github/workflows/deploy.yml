name: Deploy Infrastructure 

on:
  workflow_run:
    workflows: ["CI - Build & Push"]
    types: [completed]
    branches: [main]
  
  workflow_dispatch:   

permissions:
 id-token: write
 contents: read

env:
    AWS_REGION: eu-north-1
    TF_VAR_ecr_sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
jobs:
  
    deploy:
      name: Deploy
      runs-on: ubuntu-latest   

      defaults:
        run:
         working-directory: ./terrform  

      steps:
        - name: Checkout code
          uses: actions/checkout@v7

        - name: Configure AWS credentials (OIDC)
          uses: aws-actions/configure-aws-credentials@v4
          with:
           role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
           aws-region: ${{ env.AWS_REGION }}  
        
        - name: Set Cloudflare API Token
          run: echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> $GITHUB_ENV
 
        - name: Install Terraform
          uses: hashicorp/setup-terraform@v4 
          
        - name: Terraform Init
          id: init
          run: terraform init -input=false

        - name: Terraform Validate
          id: validate
          run: terraform validate 

        - name: Verify image SHA
          run: |
             if [ -z "$TF_VAR_ecr_sha" ]; then
              echo "ERROR: ECR SHA is missing"
              exit 1
             fi
             echo "Deploying image SHA: $TF_VAR_ecr_sha"
        - name: Terraform Plan
          id: plan
          run: terraform plan -no-color -input=false

#        - name: Terraform Apply
#          id: apply
#          run: terraform apply -auto-approve  