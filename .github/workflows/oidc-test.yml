on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
    Github_actions_job:
        name: Github_actions_job
        runs-on: ubuntu-latest
        steps:
        - name: Check GitHub Context
          run: |
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Ref: $GITHUB_REF"
            echo "Event: $GITHUB_EVENT_NAME"    
            
        - name: Show OIDC claims (right before assume)
          env:
            AUDIENCE: "sts.amazonaws.com"
          run: |
                TOKEN_JSON=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")
                ID_TOKEN=$(echo "$TOKEN_JSON" | jq -r .value)
                echo "$ID_TOKEN" | awk -F. '{print $2}' | base64 -d 2>/dev/null | jq -r    
        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v6.3.0
          with: 
            role-to-assume: arn:aws:iam::117889972608:role/github-actions-role 
            aws-region: eu-north-1
        - name: Additional steps
          run: |
            # Your commands that require AWS credentials
            aws sts get-caller-identity
            